<div class="shell">
  <aside class="side" id="side" aria-label="Sidebar">
    <div class="side-top"><p class="brand"><i aria-hidden="true"></i><span class="bn">Life Organiser<span class="ver">Version __VERSION__</span></span></p>
      <button class="icon-btn" data-act="app-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Life Organiser options" title="Options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search everything" aria-keyshortcuts="/ Meta+K Control+K"></label>
    <nav id="nav" aria-label="Items"></nav>
  </aside>
  <div class="side-scrim" id="sideScrim"></div>
  <div class="main">
    <header class="bar">
      <button class="icon-btn" id="sideToggle" aria-label="Show or hide the sidebar" title="Sidebar ( [ )"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <span class="spacer"></span>
      <span class="demo-chip" id="demoChip" hidden title="Sample data. Changes stay in this browser.">Demo · sample data</span>
      <button class="link" id="keysLink">Shortcuts</button>
      <button class="icon-btn filled" id="itemMenu" aria-haspopup="menu" aria-expanded="false" aria-label="Item options" title="Item options" hidden><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
      <button class="pill" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New</button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<button class="fab" id="fab" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="fTitle" inert></aside>
<section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" inert></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
