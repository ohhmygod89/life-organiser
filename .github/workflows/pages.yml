name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}   # the real app deploys to Firebase Hosting once this secret is added
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 build.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          mkdir -p _site/demo && cp dist/demo/index.html _site/demo/index.html
          cp VERSION _site/version.txt
      - name: Tag the release from VERSION
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            echo "$V already tagged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git tag -a "$V" -m "$V"
            git push origin "$V"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Deploy the real app to Firebase Hosting
        if: ${{ env.FIREBASE_SA != '' }}
        continue-on-error: true   # a Firebase problem never blocks the demo deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: life-organiser-7fc5f
